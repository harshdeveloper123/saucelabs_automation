name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
      - name: Check Firefox
        run: |
          firefox --version
          which firefox

      - name: Run tests
        env:
          BROWSER: firefox
          BASE_URL: https://www.saucedemo.com/
          IMPLICIT_WAIT: 5000
          PAGE_LOAD_TIMEOUT: 30000
          SCRIPT_TIMEOUT: 30000
          DEFAULT_WAIT: 5000
          MAX_WAIT: 30000
          USER_NAME: ${{ secrets.USER_NAME }}
          PASS_WORD: ${{ secrets.PASS_WORD }}
        run: npm test
